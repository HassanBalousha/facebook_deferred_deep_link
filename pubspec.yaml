name: facebook_deferred_deep_link
description: Fetch the deferred deep link of a Meta (Facebook) app install ad on Android and iOS, using the official Facebook SDK without changing its settings.
version: 0.1.0
repository: https://github.com/HassanBalousha/facebook_deferred_deep_link
issue_tracker: https://github.com/HassanBalousha/facebook_deferred_deep_link/issues

topics:
  - facebook
  - deep-linking
  - deferred-deep-link
  - attribution

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.1

flutter:
  plugin:
    platforms:
      android:
        package: dev.fbdeferred.facebook_deferred_deep_link
        pluginClass: FacebookDeferredDeepLinkPlugin
      ios:
        pluginClass: FacebookDeferredDeepLinkPlugin
